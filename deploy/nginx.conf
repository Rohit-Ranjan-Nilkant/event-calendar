# ─────────────────────────────────────────────────────────────────────────────
# Event Calendar — Nginx reverse-proxy configuration
#
# 1. Copy to server:
#      scp deploy/nginx.conf user@server:/etc/nginx/sites-available/event-calendar
#
# 2. Enable the site:
#      ln -s /etc/nginx/sites-available/event-calendar \
#             /etc/nginx/sites-enabled/event-calendar
#      rm -f /etc/nginx/sites-enabled/default
#
# 3. Test + reload:
#      nginx -t && systemctl reload nginx
#
# 4. Obtain SSL certificate (replace yourdomain.com):
#      certbot --nginx -d yourdomain.com -d www.yourdomain.com
#    Certbot will fill in the ssl_* directives automatically.
# ─────────────────────────────────────────────────────────────────────────────

# Redirect plain HTTP → HTTPS
server {
    listen      80;
    server_name yourdomain.com www.yourdomain.com;

    # Required for Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main server block
server {
    listen      443 ssl;
    http2       on;
    server_name yourdomain.com www.yourdomain.com;

    # ── SSL (filled in by certbot) ────────────────────────────────────────────
    # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Upload size ───────────────────────────────────────────────────────────
    # Profile photos + logo uploads are capped at ~2 MB in the app;
    # allow 10 M here as a safe ceiling.
    client_max_body_size 10M;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Express backend: API routes ───────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    # ── Express backend: static avatar / logo files ───────────────────────────
    location /avatars/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Aggressive caching for static uploads (1 week, revalidate on change)
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ── Next.js frontend ──────────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support (Next.js HMR / future use)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard forwarding headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
